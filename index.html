<style>
:root{color-scheme:dark;--bg:#0b1118;--text:#efe9dc;--muted:#c4bfb1;--hair:rgba(239,233,220,.22);--serif:"Newsreader","Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--serif);font-size:1rem;line-height:1.55;font-optical-sizing:auto;text-rendering:optimizeLegibility}
h1,p,figure{margin:0}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
.mark{display:inline-flex;align-items:baseline;white-space:nowrap;font-weight:500;font-size:1.25rem;line-height:1;letter-spacing:.24em;text-transform:uppercase}
h1{font-weight:340;letter-spacing:-.018em;text-wrap:balance}
.link{display:inline-flex;align-items:center;min-height:2.75rem;font-size:1rem;letter-spacing:.01em;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.35em}
.link:hover{text-decoration-thickness:2px}
.link:focus-visible{outline:2px solid currentColor;outline-offset:6px}
.legal{font-size:.8125rem;line-height:1.7;color:var(--muted)}
.legal b{font-weight:500;color:var(--text)}
.nw{white-space:nowrap}
@media (min-width:1700px){.mark{font-size:1.5rem}}

@font-face{font-family:"Newsreader";font-style:normal;font-weight:300 600;font-display:block;src:url(assets/fonts/newsreader-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:300 600;font-display:block;src:url(assets/fonts/newsreader-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

body{background:var(--bg);color:var(--text)}
.stage{position:relative;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh;min-height:100svh;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-2;background:#0b1118 url(assets/hero.jpg) 50% 50%/cover no-repeat}
.shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,12,18,0.75) 0%,rgba(8,12,18,0.60) 30%,rgba(8,12,18,0) 62%),linear-gradient(rgba(8,12,18,0.3),rgba(8,12,18,0.3)),linear-gradient(180deg,rgba(8,12,18,.55) 0%,rgba(8,12,18,.10) 26%,rgba(8,12,18,.22) 55%,rgba(8,12,18,.80) 100%)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:1.75rem 3rem 1.25rem}
.hero{align-self:start;padding:clamp(3.5rem,13svh,8rem) 3rem 0}
h1{font-size:clamp(1.9rem,3.4vw,3.5rem);line-height:1.14;max-width:19em;font-weight:360;letter-spacing:-.012em;font-feature-settings:"liga" 1,"clig" 1}
footer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;padding:3rem 0 2.5rem;border-top:0;background:linear-gradient(180deg,rgba(11,17,24,0) 0,rgba(11,17,24,.92) 2.75rem,#0b1118 100%)}
footer .id{padding:0 2rem 0 3rem}
footer .reg{padding:0 3rem 0 0}
@media (max-width:1140px){footer{grid-template-columns:1fr}footer .id{padding:0 3rem}footer .reg{padding:.9rem 3rem 0}footer .reg p+p{margin-top:.5rem}}
footer p+p{margin-top:0}
@media (max-width:900px){
.bar{padding:1rem 1.5rem}
.hero{min-height:calc(100svh - 4.5rem);display:flex;flex-direction:column;justify-content:flex-start;padding:2.75rem 1.5rem 3rem;align-self:auto}
.stage{grid-template-rows:auto auto auto}
.bg{background-position:42% 50%}
.shade{background:linear-gradient(rgba(8,12,18,0.52),rgba(8,12,18,0.52)),linear-gradient(180deg,rgba(8,12,18,.50) 0%,rgba(8,12,18,.08) 30%,rgba(8,12,18,.30) 100%)}
footer{grid-template-columns:1fr;padding:3.5rem 0 2rem}
footer .id{padding:0 1.5rem}
footer .reg{padding:.9rem 1.5rem 0}
}
@media (max-width:520px){.mark{font-size:1.125rem;letter-spacing:.2em}.bar .link{font-size:.9375rem}}
.stage{grid-template-columns:minmax(0,1fr)}
.bar{flex-wrap:wrap;column-gap:1.5rem;row-gap:.25rem}
@media (max-width:15em){.nw{white-space:normal}}
@media (max-width:1140px){footer .id p+p{margin-top:.5rem}}
h1 .tail{display:block}
@media (max-width:30em){h1{font-size:clamp(1.3rem,6.7vw,1.9rem)}}
footer{display:block;padding:3rem 3rem 2.5rem}
.legal{font-size:.75rem;color:#aaa597}
.legal .who{font-size:.875rem;line-height:1.5;margin-bottom:.4rem}
.legal .ids{display:flex;flex-wrap:wrap;column-gap:1.6em}
@media (max-width:900px){footer{padding:3.5rem 1.5rem 2rem}}
@media print{
:root{color-scheme:light}
html,body{background:#fff !important}
*{background:none !important;color:#111 !important;text-shadow:none !important;transform:none !important}
.bg,.shade,.img{display:none !important}
.stage,.split,.panel,.copy,.hero,main,footer{display:block !important;min-height:0 !important;padding:0 !important}
.bar{display:flex !important;justify-content:space-between;align-items:baseline;padding:0 0 1.5rem !important}
.panel>header{display:block !important;padding:0 0 1.5rem !important}
h1{font-size:2rem !important;margin:2rem 0 !important;max-width:none !important}
.copy .link{margin-top:1rem}
footer{padding-top:1.5rem !important}
footer .id,footer .reg{padding:0 !important}
.legal::before{display:none !important}
}

</style>
